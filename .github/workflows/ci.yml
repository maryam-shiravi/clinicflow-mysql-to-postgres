name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned requirements
        run: pip install -r requirements.txt
      - name: Libraries import
        run: python -c "import faker, mysql.connector, psycopg2; print('imports ok')"
      - name: Syntax check
        run: python -m compileall -q migrator seed_clinic_data.py
